<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Account | My MQA+</title><link rel="stylesheet" href="styles.css"><style>.auth{min-height:calc(100vh - 82px);display:grid;place-items:center;padding:50px 20px}.auth-card{width:min(100%,520px);background:#fff;border:1px solid var(--line);border-radius:24px;padding:36px;box-shadow:0 24px 70px #4a205d12}.auth-card h1{font-size:38px;margin:4px 0 8px}.auth-card>p{color:var(--muted);line-height:1.55}.auth-card label{display:block;font-size:12px;font-weight:800;margin:16px 0 7px}.auth-card input{width:100%;padding:13px;border:1px solid #d9cedf;border-radius:10px;font:inherit}.auth-card button{border:0;width:100%;margin-top:22px;cursor:pointer}.auth-status{font-size:13px;min-height:20px;margin-top:14px}.auth-links{text-align:center;font-size:13px;margin-top:20px}.auth-links a{color:var(--purple);font-weight:800}</style></head><body><header class="topbar"><a class="brand" href="./"><span class="mark">MQA<span>+</span></span><span class="brand-copy"><strong>My MQA+</strong><small>Member & Community Portal</small></span></a><a class="main-site" href="https://www.mcultural.org/">Visit MQA+ Website</a></header><main class="auth"><form class="auth-card" id="registerForm"><p class="eyebrow">FREE PORTAL ACCOUNT</p><h1>Create My MQA+</h1><p>Create your free account. We'll email you a secure link to verify your address before you sign in.</p><label for="first">First name</label><input id="first" autocomplete="given-name" required><label for="last">Last name</label><input id="last" autocomplete="family-name" required><label for="email">Email</label><input id="email" type="email" autocomplete="email" required><label for="password">Password</label><input id="password" type="password" autocomplete="new-password" minlength="10" required><button class="btn primary" type="submit">Create Free Account</button><div class="auth-status" id="status" aria-live="polite"></div><div class="auth-links">Already have an account? <a href="signin.html">Sign in</a></div></form></main><script>const API="https://mqa-portal.luisxaviercruz.workers.dev";document.getElementById("registerForm").addEventListener("submit",async(e)=>{e.preventDefault();const s=document.getElementById("status");s.textContent="Creating your account…";const body={first_name:document.getElementById("first").value.trim(),last_name:document.getElementById("last").value.trim(),email:document.getElementById("email").value.trim(),password:document.getElementById("password").value};try{const r=await fetch(API+"/auth/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});const d=await r.json();s.textContent=d.message||(r.ok?"Check your email for your verification link.":"We couldn't create your account.");if(r.ok){setTimeout(()=>{location.href="signin.html"},3500)}}catch(_){s.textContent="We couldn't connect to My MQA+. Please try again."}});</script></body></html>
