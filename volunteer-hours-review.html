<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Volunteer Hours Review | MQA+</title><style>body{margin:0;background:#faf8fc;color:#33223d;font-family:system-ui,-apple-system,sans-serif}header{background:linear-gradient(130deg,#34144e,#70318b);color:white;padding:25px max(18px,calc((100% - 940px)/2))}header a{color:white}main{max-width:940px;margin:auto;padding:24px 18px}.card{background:white;border:1px solid #e9e0ef;border-radius:15px;padding:22px;margin:16px 0}h1{margin-bottom:4px}h2{color:#54266f}.muted{color:#665b70}.entry{padding:17px 0;border-top:1px solid #e9e0ef}.entry strong{display:block}.entry small{color:#665b70}textarea{width:100%;max-width:600px;box-sizing:border-box;display:block;padding:10px;border:1px solid #bdb0c8;border-radius:8px;margin:10px 0;font:inherit}button{border:0;border-radius:8px;background:#54266f;color:white;padding:10px 15px;margin-right:8px;cursor:pointer}button.reject{background:#793b47}button:disabled{opacity:.5}#status{padding:10px 0}</style></head><body><header><a href="volunteer-dashboard.html">← Volunteer Center</a><h1>Volunteer Hours Review</h1><p>Authorized coordinator and director workspace</p></header><main><p id="status" role="status">Verifying your session and review access…</p><section class="card" id="review-section" hidden><h2>Hours Awaiting Review</h2><p class="muted">Only submissions within your verified department authorization are shown. You cannot review your own hours.</p><div id="queue" aria-live="polite"></div></section></main><script>const API='https://mqa-portal.luisxaviercruz.workers.dev';let token='';const status=document.getElementById('status'),queue=document.getElementById('queue');function el(tag,content){const n=document.createElement(tag);n.textContent=content;return n}async function loadQueue(){const r=await fetch(API+'/volunteer-api/review-queue',{headers:{Authorization:'Bearer '+token},cache:'no-store'});if(r.status===403){status.textContent='You do not have access to volunteer hour reviews.';return}if(!r.ok)throw Error('Review queue is not available yet.');const data=await r.json();if(!Array.isArray(data.hours))throw Error('Invalid review queue response.');document.getElementById('review-section').hidden=false;queue.replaceChildren();status.textContent='Showing submissions authorized for your department.';if(!data.hours.length)queue.append(el('p','No reviewable submissions are currently available.'));for(const h of data.hours){const item=document.createElement('div');item.className='entry';item.append(el('strong',String(h.activity_name||'Volunteer activity')));item.append(el('small',String(h.service_date||'')+' · '+(Number(h.minutes_served)/60).toFixed(2)+' hours · '+String(h.service_category||'other')));if(h.notes)item.append(el('p',String(h.notes)));const note=document.createElement('textarea');note.placeholder='Review note (required when rejecting)';note.maxLength=2000;note.setAttribute('aria-label','Review note for '+String(h.activity_name||'activity'));item.append(note);const msg=el('p','');msg.setAttribute('role','status');for(const decision of ['approved','rejected']){const b=el('button',decision==='approved'?'Approve':'Reject');if(decision==='rejected')b.className='reject';b.addEventListener('click',async()=>{if(decision==='rejected'&&!note.value.trim()){msg.textContent='Enter a reason before rejecting.';return}const buttons=item.querySelectorAll('button');buttons.forEach(x=>x.disabled=true);msg.textContent='Saving decision…';try{const response=await fetch(API+'/volunteer-api/hours/'+encodeURIComponent(h.id)+'/review',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({decision,note:note.value.trim()})});if(!response.ok)throw Error(response.status===409?'This record has already been reviewed.':'Unable to save decision.');await loadQueue()}catch(e){msg.textContent=e.message;buttons.forEach(x=>x.disabled=false)}});item.append(b)}item.append(msg);queue.append(item)}}(async()=>{token=localStorage.getItem('mqa_session')||'';if(!token){status.textContent='Please sign in to access this workspace.';return}try{const r=await fetch(API+'/auth/me',{headers:{Authorization:'Bearer '+token},cache:'no-store'});if(!r.ok||!(await r.json()).user)throw Error('Your session could not be verified.');await loadQueue()}catch(e){status.textContent=e.message}})();</script></body></html>
