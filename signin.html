<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign In | My MQA+</title><link rel="stylesheet" href="styles.css"><style>.auth{min-height:calc(100vh - 82px);display:grid;place-items:center;padding:50px 20px}.auth-card{width:min(100%,500px);background:#fff;border:1px solid var(--line);border-radius:24px;padding:36px;box-shadow:0 24px 70px #4a205d12}.auth-card h1{font-size:38px;margin:4px 0 8px}.auth-card>p{color:var(--muted)}.auth-card label{display:block;font-size:12px;font-weight:800;margin:16px 0 7px}.auth-card input{width:100%;padding:13px;border:1px solid #d9cedf;border-radius:10px;font:inherit}.auth-card button{border:0;width:100%;margin-top:22px;cursor:pointer}.auth-status{font-size:13px;min-height:20px;margin-top:14px;line-height:1.5}.forgot{display:block;text-align:right;margin-top:8px;font-size:13px;color:var(--purple);font-weight:800}.auth-links{text-align:center;font-size:13px;margin-top:20px}.auth-links a{color:var(--purple);font-weight:800}</style></head><body><header class="topbar"><a class="brand" href="./"><span class="mark">MQA<span>+</span></span><span class="brand-copy"><strong>My MQA+</strong><small>Member & Community Portal</small></span></a><a class="main-site" href="https://www.mcultural.org/">Visit MQA+ Website</a></header><main class="auth"><form class="auth-card" id="signinForm"><p class="eyebrow">WELCOME BACK</p><h1>Sign in to My MQA+</h1><p>Access your MQA+ account and portal.</p><label for="email">Email</label><input id="email" type="email" autocomplete="email" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><a class="forgot" href="forgot-password.html">Forgot password?</a><button class="btn primary" type="submit">Sign In</button><div class="auth-status" id="status" aria-live="polite"></div><div class="auth-links">New to My MQA+? <a href="create-account.html">Create a free account</a></div></form></main><script>
const API="https://mqa-portal.luisxaviercruz.workers.dev";
document.getElementById("signinForm").addEventListener("submit",async e=>{e.preventDefault();const s=document.getElementById("status");s.textContent="Signing you in…";try{const r=await fetch(API+"/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:document.getElementById("email").value.trim(),password:document.getElementById("password").value})});let d={};try{d=await r.json()}catch(_){}
if(!r.ok){s.textContent=d.message||d.error||"We couldn't sign you in. Check your email and password.";return}
const token=d.session_token||d.token;if(!token){s.textContent="Sign-in succeeded but no session was returned. Please try again.";return}localStorage.setItem("mqa_session",token);location.href="./"}catch(_){s.textContent="We couldn't connect to My MQA+. Please try again."}});
</script></body></html>
