<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Choose New Password | My MQA+</title><link rel="stylesheet" href="styles.css"><style>.auth{min-height:calc(100vh - 82px);display:grid;place-items:center;padding:50px 20px}.auth-card{width:min(100%,500px);background:#fff;border:1px solid var(--line);border-radius:24px;padding:36px;box-shadow:0 24px 70px #4a205d12}.auth-card h1{font-size:38px;margin:4px 0 8px}.auth-card>p{color:var(--muted);line-height:1.6}.auth-card label{display:block;font-size:12px;font-weight:800;margin:16px 0 7px}.auth-card input{width:100%;padding:13px;border:1px solid #d9cedf;border-radius:10px;font:inherit}.auth-card button{border:0;width:100%;margin-top:22px;cursor:pointer}.auth-status{font-size:13px;min-height:20px;margin-top:14px;line-height:1.5}.auth-links{text-align:center;font-size:13px;margin-top:20px}.auth-links a{color:var(--purple);font-weight:800}</style></head><body><header class="topbar"><a class="brand" href="./"><span class="mark">MQA<span>+</span></span><span class="brand-copy"><strong>My MQA+</strong><small>Member & Community Portal</small></span></a><a class="main-site" href="https://www.mcultural.org/">Visit MQA+ Website</a></header><main class="auth"><form class="auth-card" id="resetForm"><p class="eyebrow">ACCOUNT RECOVERY</p><h1>Choose a new password</h1><p>Your password must have at least 10 characters, including an uppercase letter, lowercase letter, and number.</p><label for="password">New Password</label><input id="password" type="password" autocomplete="new-password" required minlength="10"><label for="confirm">Confirm New Password</label><input id="confirm" type="password" autocomplete="new-password" required minlength="10"><button class="btn primary" type="submit">Reset Password</button><div class="auth-status" id="status" aria-live="polite"></div><div class="auth-links"><a href="signin.html">Back to Sign In</a></div></form></main><script>
const API="https://mqa-portal.luisxaviercruz.workers.dev";const token=new URLSearchParams(location.search).get("token");const status=document.getElementById("status");if(!token)status.textContent="This password-reset link is incomplete.";
document.getElementById("resetForm").addEventListener("submit",async e=>{e.preventDefault();if(!token)return;const p=document.getElementById("password").value,c=document.getElementById("confirm").value;if(p!==c){status.textContent="The passwords do not match.";return}status.textContent="Updating your password…";try{const r=await fetch(API+"/auth/reset-password",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token,password:p})});let d={};try{d=await r.json()}catch(_){};if(!r.ok){status.textContent=d.message||d.error||"We couldn't reset your password.";return}status.innerHTML='Password updated successfully. <a href="signin.html">Sign in to My MQA+</a>.'}catch(_){status.textContent="We couldn't connect to My MQA+. Please try again."}});
</script></body></html>
